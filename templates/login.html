{% extends "layout.html" %}

{% block title %}
    Log in
{% endblock %}

{% block main %}
    <h1>Log in</h1>
    <p class="lede">Pick up where you left off.</p>

    <form action="/login" method="post" class="form-card narrow">
        <div class="field">
            <label for="username">Username</label>
            <input autocomplete="username" autofocus id="username" name="username" type="text" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input autocomplete="current-password" id="password" name="password" type="password" required>
        </div>
        <button class="button" type="submit">Log in</button>
    </form>

    <p class="hint">New here? <a href="/register">Create an account</a>.</p>
{% endblock %}
